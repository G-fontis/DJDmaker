[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "djd-maker"
version = "0.1.1"
description = "台本から授業動画つくるマシーン"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "playwright>=1.49,<2",
]

[project.scripts]
djd-maker = "djd_maker.gui.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
build = ["pyinstaller>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
